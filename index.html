<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ရွှေဖြိုးအိမ် - ဈေးနှုန်းမှတ်တမ်း</title>
    <style>
        body {
            background-color: #0d0d0d;
            color: #ffffff;
            font-family: sans-serif;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
        }
        h2 {
            text-align: center;
            color: #00ffcc;
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.5);
            margin-bottom: 25px;
        }
        
        /* ပစ္စည်းအသစ်ထည့်ရန် Box */
        .add-box {
            background-color: #1a1a1a;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #333;
            margin-bottom: 25px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .add-box h3 {
            margin: 0 0 10px 0;
            font-size: 16px;
            color: #ff2a6d;
        }
        .input-field {
            padding: 12px;
            background-color: #0d0d0d;
            border: 1px solid #333;
            color: #fff;
            border-radius: 5px;
            font-size: 14px;
        }
        .input-field:focus {
            outline: none;
            border-color: #ff2a6d;
        }
        .add-btn {
            background-color: #ff2a6d;
            color: #fff;
            border: none;
            padding: 12px;
            border-radius: 5px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(255, 42, 109, 0.3);
        }
        .add-btn:active {
            transform: scale(0.98);
        }

        /* ရှာဖွေရန် Box */
        .search-box {
            width: 100%;
            padding: 15px;
            box-sizing: border-box;
            background-color: #1a1a1a;
            border: 2px solid #333;
            color: #00ffcc;
            border-radius: 10px;
            font-size: 16px;
            margin-bottom: 20px;
        }
        .search-box:focus {
            outline: none;
            border-color: #00ffcc;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.3);
        }

        /* ဈေးနှုန်းပြသမည့်စာရင်း */
        .results {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .item {
            background-color: #1a1a1a;
            padding: 15px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 4px solid #00ffcc;
        }
        .item-info {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .item-name {
            font-size: 16px;
        }
        .item-price {
            color: #00ffcc;
            font-weight: bold;
            font-size: 15px;
        }
        .delete-btn {
            background: none;
            border: none;
            color: #ff4444;
            font-size: 18px;
            cursor: pointer;
            padding: 5px;
        }
        .no-result {
            text-align: center;
            color: #888;
            padding: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>ရွှေဖြိုးအိမ် ကုန်စုံဆိုင်</h2>

    <!-- ပစ္စည်းအသစ်ထည့်ရန် နေရာ -->
    <div class="add-box">
        <h3>+ ပစ္စည်းသစ် ထည့်ရန်</h3>
        <input type="text" id="newName" class="input-field" placeholder="ပစ္စည်းအမည် (ဥပမာ - ရေသန့်)">
        <input type="text" id="newPrice" class="input-field" placeholder="ဈေးနှုန်း (ဥပမာ - ၄၀၀ ကျပ်)">
        <button class="add-btn" onclick="addNewProduct()">စာရင်းသွင်းမည်</button>
    </div>

    <!-- ရှာဖွေရန် နေရာ -->
    <input type="text" id="searchInput" class="search-box" placeholder="ပစ္စည်းအမည် ရှာရန်...">
    
    <div class="results" id="resultsContainer"></div>
</div>

<script>
    // Browser ရဲ့ Local Storage ထဲကနေ Data ကို ခေါ်ယူခြင်း (မရှိရင် အလွတ်ပြမည်)
    let products = JSON.parse(localStorage.getItem('shwePhyoData')) || [];

    const searchInput = document.getElementById('searchInput');
    const resultsContainer = document.getElementById('resultsContainer');

    // Data များကို ဖုန်းထဲတွင် မှတ်သားပေးမည့် Function
    function saveData() {
        localStorage.setItem('shwePhyoData', JSON.stringify(products));
    }

    // UI တွင် ပစ္စည်းစာရင်း ပြသပေးမည့် Function
    function displayProducts(productList) {
        resultsContainer.innerHTML = '';
        
        if (productList.length === 0) {
            resultsContainer.innerHTML = '<div class="no-result">မှတ်တမ်းမရှိသေးပါ (သို့) ရှာမတွေ့ပါ...</div>';
            return;
        }

        productList.forEach(product => {
            const div = document.createElement('div');
            div.className = 'item';
            div.innerHTML = `
                <div class="item-info">
                    <span class="item-name">${product.name}</span>
                    <span class="item-price">${product.price}</span>
                </div>
                <button class="delete-btn" onclick="deleteProduct(${product.id})">🗑️</button>
            `;
            resultsContainer.appendChild(div);
        });
    }

    // ပစ္စည်းအသစ် ထည့်မည့် Function
    function addNewProduct() {
        const nameInput = document.getElementById('newName');
        const priceInput = document.getElementById('newPrice');
        
        const nameValue = nameInput.value.trim();
        const priceValue = priceInput.value.trim();

        if (nameValue !== "" && priceValue !== "") {
            // ID ကို အချိန်နှင့် သတ်မှတ်၍ Unique ဖြစ်အောင်လုပ်ခြင်း
            const newProduct = {
                id: Date.now(),
                name: nameValue,
                price: priceValue
            };
            
            products.push(newProduct);
            saveData(); // Storage ထဲ သိမ်းမည်
            
            // Box များကို အလွတ်ပြန်ထားမည်
            nameInput.value = '';
            priceInput.value = '';
            searchInput.value = '';
            
            displayProducts(products); // စာရင်းပြန်ပြမည်
        } else {
            alert("ပစ္စည်းအမည် နှင့် ဈေးနှုန်း ထည့်ပေးပါ။");
        }
    }

    // ပစ္စည်းပြန်ဖျက်မည့် Function
    function deleteProduct(id) {
        if(confirm("ဒီပစ္စည်းကို စာရင်းထဲကနေ ဖျက်မှာ သေချာလား?")) {
            products = products.filter(product => product.id !== id);
            saveData();
            
            // ရှာဖွေနေတဲ့ စာလုံးရှိရင် ဆက်ရှာပေးထားအောင်
            const query = searchInput.value.toLowerCase();
            const filteredProducts = products.filter(product => 
                product.name.toLowerCase().includes(query)
            );
            displayProducts(filteredProducts);
        }
    }

    // ရှာဖွေရေး Input အတွက် Event Listener
    searchInput.addEventListener('input', (e) => {
        const query = e.target.value.toLowerCase();
        const filteredProducts = products.filter(product => 
            product.name.toLowerCase().includes(query)
        );
        displayProducts(filteredProducts);
    });

    // စတင်ဖွင့်ချိန်တွင် ရှိပြီးသား Data များကို ပြသရန်
    displayProducts(products);
</script>

</body>
</html>
