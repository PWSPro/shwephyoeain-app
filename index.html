<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ရွှေဖြိုးအိမ် - PRO Database</title>
    <style>
        :root {
            --neon-cyan: #00ffcc;
            --neon-pink: #ff2a6d;
            --dark-bg: #090a0f;
            --glass-bg: rgba(25, 26, 35, 0.7);
        }
        body {
            background-color: var(--dark-bg);
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(0, 255, 204, 0.05), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(255, 42, 109, 0.05), transparent 25%);
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 15px;
            min-height: 100vh;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
        }
        h2 {
            text-align: center;
            color: var(--neon-cyan);
            text-shadow: 0 0 15px rgba(0, 255, 204, 0.4);
            letter-spacing: 1px;
            margin-bottom: 20px;
            font-size: 22px;
        }
        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        input {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 12px;
            border-radius: 8px;
            color: #fff;
            font-size: 15px;
            transition: all 0.3s;
            width: 100%;
            box-sizing: border-box;
        }
        input:focus {
            outline: none;
            border-color: var(--neon-cyan);
            box-shadow: 0 0 10px rgba(0, 255, 204, 0.2);
        }
        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 5px;
        }
        button {
            border: none;
            padding: 12px;
            border-radius: 8px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            flex: 1;
            font-size: 14px;
        }
        button:active { transform: scale(0.95); }
        .add-btn {
            background: linear-gradient(45deg, #ff2a6d, #ff5e8e);
            box-shadow: 0 4px 15px rgba(255, 42, 109, 0.3);
        }
        .backup-btn {
            background: rgba(0, 255, 204, 0.15);
            border: 1px solid var(--neon-cyan);
            color: var(--neon-cyan);
        }
        .search-box {
            border-color: rgba(0, 255, 204, 0.3);
            margin-bottom: 15px;
        }
        .item {
            background: rgba(0, 0, 0, 0.4);
            border-left: 4px solid var(--neon-cyan);
            padding: 12px 15px;
            margin-bottom: 10px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .item-info { flex: 1; }
        .item-name { font-size: 15px; display: block; margin-bottom: 4px; }
        .item-price { color: var(--neon-pink); font-weight: bold; font-size: 14px; }
        .action-btns {
            display: flex;
            gap: 8px;
        }
        .edit-btn, .delete-btn {
            background: transparent;
            border-radius: 5px;
            padding: 5px 8px;
            font-size: 12px;
            cursor: pointer;
            flex: none;
        }
        .edit-btn {
            border: 1px solid var(--neon-cyan);
            color: var(--neon-cyan);
        }
        .delete-btn {
            border: 1px solid rgba(255, 42, 109, 0.5);
            color: var(--neon-pink);
        }
        .stats {
            text-align: right;
            font-size: 12px;
            color: #aaa;
            margin-bottom: 10px;
        }
        #fileInput { display: none; }
    </style>
</head>
<body>

<div class="container">
    <h2>ရွှေဖြိုးအိမ် DATA-HUB</h2>

    <div class="glass-panel">
        <div class="input-group">
            <input type="text" id="newName" placeholder="ပစ္စည်းအမည် (ဥပမာ - ခေါက်ဆွဲထုပ်)">
            <input type="text" id="newPrice" placeholder="ဈေးနှုန်း (ဥပမာ - ၇၀၀)">
            
            <div class="btn-group">
                <button class="add-btn" onclick="addOrUpdateProduct()" id="saveBtn">စာရင်းသွင်းမည်</button>
            </div>
            
            <div class="btn-group">
                <button class="backup-btn" onclick="exportData()">💾 Backup ထုတ်ရန်</button>
                <button class="backup-btn" onclick="document.getElementById('fileInput').click()">📂 Data ပြန်သွင်းရန်</button>
                <input type="file" id="fileInput" accept=".json" onchange="importData(event)">
            </div>
        </div>
    </div>

    <input type="text" id="searchInput" class="search-box glass-panel" placeholder="🔍 ပစ္စည်းအမည် ရှာဖွေရန်...">
    <div class="stats" id="totalItems">စုစုပေါင်း: 0 မျိုး</div>
    
    <div id="resultsContainer"></div>
</div>

<script>
    let products = JSON.parse(localStorage.getItem('shwePhyoDataPRO')) || [];
    let editingId = null;

    const resultsContainer = document.getElementById('resultsContainer');
    const searchInput = document.getElementById('searchInput');
    const nameInput = document.getElementById('newName');
    const priceInput = document.getElementById('newPrice');
    const saveBtn = document.getElementById('saveBtn');
    const totalItems = document.getElementById('totalItems');

    function saveData() {
        localStorage.setItem('shwePhyoDataPRO', JSON.stringify(products));
    }

    function displayProducts(productList) {
        resultsContainer.innerHTML = '';
        totalItems.innerText = `စုစုပေါင်း: ${products.length} မျိုး`;
        
        if (productList.length === 0) {
            resultsContainer.innerHTML = '<div style="text-align:center; color:#888;">မှတ်တမ်းမရှိသေးပါ...</div>';
            return;
        }

        productList.forEach(product => {
            const div = document.createElement('div');
            div.className = 'item';
            div.innerHTML = `
                <div class="item-info">
                    <span class="item-name">${product.name}</span>
                    <span class="item-price">${product.price}</span>
                </div>
                <div class="action-btns">
                    <button class="edit-btn" onclick="editProduct(${product.id}, '${product.name}', '${product.price}')">ပြင်မည်</button>
                    <button class="delete-btn" onclick="deleteProduct(${product.id})">ဖျက်မည်</button>
                </div>
            `;
            resultsContainer.appendChild(div);
        });
    }

    function addOrUpdateProduct() {
        const nameValue = nameInput.value.trim();
        const priceValue = priceInput.value.trim();

        if (nameValue && priceValue) {
            if (editingId) {
                // ပြင်ဆင်ခြင်း
                products = products.map(p => p.id === editingId ? {...p, name: nameValue, price: priceValue} : p);
                editingId = null;
                saveBtn.innerText = "စာရင်းသွင်းမည်";
                saveBtn.style.background = "linear-gradient(45deg, #ff2a6d, #ff5e8e)";
            } else {
                // အသစ်ထည့်ခြင်း
                products.push({ id: Date.now(), name: nameValue, price: priceValue });
            }
            
            saveData();
            nameInput.value = '';
            priceInput.value = '';
            searchInput.value = '';
            displayProducts(products);
        } else {
            alert("အမည်နှင့် ဈေးနှုန်း အပြည့်အစုံထည့်ပါ။");
        }
    }

    function editProduct(id, name, price) {
        editingId = id;
        nameInput.value = name;
        priceInput.value = price;
        saveBtn.innerText = "အပြောင်းအလဲ သိမ်းမည်";
        saveBtn.style.background = "linear-gradient(45deg, #00ffcc, #00b38f)";
        window.scrollTo(0, 0); // အပေါ်ဆုံးသို့ ရွှေ့ပေးရန်
    }

    function deleteProduct(id) {
        if(confirm("ဖျက်မှာ သေချာပါသလား?")) {
            products = products.filter(p => p.id !== id);
            saveData();
            displayProducts(products.filter(p => p.name.toLowerCase().includes(searchInput.value.toLowerCase())));
        }
    }

    // JSON ဖိုင်အနေဖြင့် ဖုန်းထဲသို့ Backup ထုတ်ရန်
    function exportData() {
        if(products.length === 0) { alert("ထုတ်စရာ Data မရှိသေးပါ!"); return; }
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(products));
        const downloadAnchorNode = document.createElement('a');
        downloadAnchorNode.setAttribute("href", dataStr);
        downloadAnchorNode.setAttribute("download", "shwephyoeain_backup.json");
        document.body.appendChild(downloadAnchorNode);
        downloadAnchorNode.click();
        downloadAnchorNode.remove();
        alert("ဖုန်းထဲသို့ Backup သိမ်းဆည်းပြီးပါပြီ။");
    }

    // ဖုန်းထဲမှ Backup ဖိုင်ကို ပြန်သွင်းရန်
    function importData(event) {
        const file = event.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const importedData = JSON.parse(e.target.result);
                    if(Array.isArray(importedData)) {
                        products = importedData;
                        saveData();
                        displayProducts(products);
                        alert("Data များ အောင်မြင်စွာ ပြန်သွင်းပြီးပါပြီ!");
                    } else {
                        alert("ဖိုင်အမျိုးအစား မှားယွင်းနေပါသည်။");
                    }
                } catch(error) {
                    alert("ဖိုင်ဖတ်၍ မရပါ။");
                }
            };
            reader.readAsText(file);
        }
    }

    searchInput.addEventListener('input', (e) => {
        const query = e.target.value.toLowerCase();
        displayProducts(products.filter(p => p.name.toLowerCase().includes(query)));
    });

    displayProducts(products);
</script>

</body>
</html>
